<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient & Border -->
  <rect x="10" y="10" width="160" height="160" rx="36" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Glow -->
  <circle cx="90" cy="90" r="50" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />

  <!-- Left Bracket '[' -->
  <path d="M 46 54 L 32 54 L 32 126 L 46 126" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket ']' -->
  <path d="M 134 54 L 148 54 L 148 126 L 134 126" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Organic Sprout Accent above E -->
  <path d="M 90 48 C 86 36 74 34 72 40 C 72 48 84 50 90 54 C 96 50 108 48 108 40 C 106 34 94 36 90 48 Z" fill="url(#leafGrad)" />
  <path d="M 90 48 L 90 56" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bold Central Typography: ENT -->
  <text x="90" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="38" fill="#F8FAFC" letter-spacing="2">ENT</text>

  <!-- Tagline Pill inside Logo -->
  <rect x="52" y="117" width="76" height="14" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="90" y="127.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#94A3B8" letter-spacing="1">LANGUAGE</text>
</svg>
