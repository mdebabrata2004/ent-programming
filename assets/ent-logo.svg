<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Leaf Sprout Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .logo-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Squircle Base Canvas -->
  <rect x="8" y="8" width="164" height="164" rx="38" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="2.5" />
  
  <!-- Subtle Ambient Radial Glow -->
  <circle cx="90" cy="90" r="48" fill="#38BDF8" opacity="0.1" filter="url(#logoGlow)" />

  <!-- Left Bracket '[' -->
  <path d="M 44 52 L 30 52 L 30 128 L 44 128" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket ']' -->
  <path d="M 136 52 L 150 52 L 150 128 L 136 128" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Organic Sprout Accent (Growth / Living Tree) -->
  <path d="M 90 46 C 85 34 73 32 71 38 C 71 46 84 48 90 52 C 96 48 109 46 109 38 C 107 32 95 34 90 46 Z" fill="url(#leafGrad)" />
  <path d="M 90 46 L 90 55" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bold Central Typography: ENT -->
  <text x="90" y="106" text-anchor="middle" class="logo-font" font-weight="900" font-size="40" fill="#F8FAFC" letter-spacing="2">ENT</text>

  <!-- Tagline Pill inside Logo -->
  <g transform="translate(48, 120)">
    <rect width="84" height="16" rx="8" fill="#090D16" stroke="#334155" stroke-width="1" />
    <text x="42" y="11.5" text-anchor="middle" class="logo-font" font-weight="700" font-size="8" fill="#38BDF8" letter-spacing="1.2">LANGUAGE</text>
  </g>
</svg>