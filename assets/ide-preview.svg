<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" fill="none">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="activeFileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="ideShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .ide-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ide-mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Outer Window Frame with Shadow -->
  <g filter="url(#ideShadow)">
    <rect x="20" y="20" width="1080" height="550" rx="16" fill="url(#ideBg)" stroke="#334155" stroke-width="1.5" />

    <!-- ================= TOP NAVIGATION / TITLE BAR ================= -->
    <path d="M 20 36 C 20 27.16 27.16 20 36 20 L 1084 20 C 1092.84 20 1100 27.16 1100 36 L 1100 68 L 20 68 Z" fill="url(#topbarGrad)" />
    
    <!-- Window Controls -->
    <circle cx="44" cy="44" r="5.5" fill="#EF4444" />
    <circle cx="62" cy="44" r="5.5" fill="#F59E0B" />
    <circle cx="80" cy="44" r="5.5" fill="#10B981" />

    <!-- App Brand -->
    <text x="110" y="49" class="ide-sans" font-size="14.5" font-weight="800" fill="#F8FAFC">⚡ ENT Studio</text>
    <rect x="206" y="34" width="52" height="20" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="232" y="48" class="ide-sans" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">v0.1.0</text>

    <!-- Center / Action Toolbar Buttons -->
    <g transform="translate(420, 31)">
      <!-- Run Button -->
      <rect x="0" y="0" width="140" height="28" rx="6" fill="url(#buttonGrad)" stroke="#3B82F6" stroke-width="1" />
      <text x="70" y="18.5" class="ide-sans" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">▶ Run (Ctrl+Enter)</text>

      <!-- Check Button -->
      <rect x="150" y="0" width="90" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="195" y="18.5" class="ide-sans" font-size="11.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">✔ Check</text>

      <!-- Web Preview Button -->
      <rect x="250" y="0" width="125" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="312" y="18.5" class="ide-sans" font-size="11.5" font-weight="600" fill="#38BDF8" text-anchor="middle">🌐 Web Preview</text>
    </g>

    <!-- Right Dev Server Status -->
    <g transform="translate(930, 34)">
      <rect width="150" height="24" rx="12" fill="#020617" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="12" r="4.5" fill="#10B981" />
      <text x="26" y="16" class="ide-mono" font-size="10" font-weight="500" fill="#94A3B8">Dev Server: Online</text>
    </g>


    <!-- ================= 1. LEFT COLUMN: FILE EXPLORER ================= -->
    <g transform="translate(20, 68)">
      <rect width="200" height="502" fill="#080C14" stroke="#1E293B" stroke-width="1" />
      
      <!-- Explorer Title -->
      <text x="20" y="28" class="ide-sans" font-size="11" font-weight="800" fill="#64748B" letter-spacing="1">EXPLORER</text>
      
      <!-- File Tree Items -->
      <g transform="translate(12, 42)" class="ide-sans" font-size="12">
        <!-- hello.ent -->
        <text x="14" y="20" fill="#94A3B8">📄 hello.ent</text>
        
        <!-- variables.ent -->
        <text x="14" y="48" fill="#94A3B8">📄 variables.ent</text>
        
        <!-- math.ent -->
        <text x="14" y="76" fill="#94A3B8">📄 counter.ent</text>
        
        <!-- website.ent (Active Selection) -->
        <rect x="-4" y="93" width="184" height="32" rx="6" fill="url(#activeFileGrad)" stroke="#38BDF8" stroke-width="1.2" />
        <rect x="-4" y="93" width="4" height="32" fill="#38BDF8" />
        <text x="14" y="114" font-weight="700" fill="#38BDF8">🌐 website.ent</text>

        <!-- loops.ent -->
        <text x="14" y="152" fill="#94A3B8">📄 loops.ent</text>

        <!-- functions.ent -->
        <text x="14" y="180" fill="#94A3B8">📄 functions.ent</text>
      </g>

      <!-- Rename Hint Tooltip -->
      <g transform="translate(14, 430)">
        <rect width="172" height="48" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <text x="86" y="20" class="ide-sans" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">💡 Inline Rename</text>
        <text x="86" y="36" class="ide-sans" font-size="9.5" fill="#94A3B8" text-anchor="middle">Press F2 or right click file</text>
      </g>
    </g>


    <!-- ================= 2. MIDDLE COLUMN: MONACO CODE EDITOR ================= -->
    <g transform="translate(220, 68)">
      <rect width="460" height="360" fill="#0D131F" stroke="#1E293B" stroke-width="1" />

      <!-- Editor Tab Header -->
      <rect width="460" height="32" fill="#080C14" />
      <g transform="translate(12, 0)">
        <rect width="130" height="32" fill="#0D131F" stroke="#38BDF8" stroke-width="1" />
        <text x="24" y="20" class="ide-mono" font-size="11.5" font-weight="600" fill="#F8FAFC">website.ent</text>
        <circle cx="10" cy="16" r="3.5" fill="#38BDF8" />
        <text x="115" y="20" class="ide-sans" font-size="12" fill="#64748B">×</text>
      </g>

      <!-- Line Numbers Column -->
      <g transform="translate(12, 54)" class="ide-mono" font-size="11" fill="#475569" text-anchor="end">
        <text x="22" y="0">1</text>
        <text x="22" y="22">2</text>
        <text x="22" y="44">3</text>
        <text x="22" y="66">4</text>
        <text x="22" y="88">5</text>
        <text x="22" y="110">6</text>
        <text x="22" y="132">7</text>
        <text x="22" y="154">8</text>
        <text x="22" y="176">9</text>
        <text x="22" y="198">10</text>
        <text x="22" y="220">11</text>
        <text x="22" y="242">12</text>
        <text x="22" y="264">13</text>
        <text x="22" y="286">14</text>
      </g>

      <!-- Active Line Highlight -->
      <rect x="42" y="72" width="418" height="22" fill="#1E293B" fill-opacity="0.35" />

      <!-- Code Text with Syntax Coloring -->
      <g transform="translate(52, 54)" class="ide-mono" font-size="11.5">
        <text x="0" y="0" fill="#38BDF8" font-weight="700">[</text>
        <text x="14" y="22" fill="#818CF8">page<tspan fill="#F8FAFC">(</tspan><tspan fill="#94A3B8">title = </tspan><tspan fill="#34D399">"Welcome to ENT"</tspan><tspan fill="#F8FAFC">)</tspan> <tspan fill="#38BDF8">[</tspan></text>
        
        <text x="28" y="44" fill="#60A5FA">heading<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Build Websites in Simple English"</tspan><tspan fill="#94A3B8">, level = </tspan><tspan fill="#F59E0B">1</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text x="28" y="66" fill="#60A5FA">paragraph<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"ENT is readable for everyone."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text x="28" y="88" fill="#60A5FA">section<tspan fill="#F8FAFC">()</tspan> <tspan fill="#38BDF8">[</tspan></text>
        <text x="42" y="110" fill="#60A5FA">heading<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Why ENT?"</tspan><tspan fill="#94A3B8">, level = </tspan><tspan fill="#F59E0B">2</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text x="42" y="132" fill="#60A5FA">paragraph<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"No scary curly braces or symbols."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text x="42" y="154" fill="#F472B6">button<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Get Started"</tspan><tspan fill="#94A3B8">, onclick = </tspan><tspan fill="#34D399">"alert('Hi!')"</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text x="42" y="176" fill="#F472B6">link<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Read Docs"</tspan><tspan fill="#94A3B8">, url = </tspan><tspan fill="#34D399">"https://..."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text x="28" y="198" fill="#38BDF8">]</text>
        <text x="14" y="220" fill="#38BDF8">]</text>
        <text x="0" y="242" fill="#38BDF8" font-weight="700">]</text>
      </g>
    </g>


    <!-- ================= 3. RIGHT COLUMN: LIVE BROWSER PREVIEW ================= -->
    <g transform="translate(680, 68)">
      <rect width="420" height="360" fill="#111827" stroke="#1E293B" stroke-width="1" />
      
      <!-- Browser Top Bar -->
      <rect width="420" height="32" fill="#1E293B" />
      <circle cx="16" cy="16" r="3.5" fill="#475569" />
      <circle cx="28" cy="16" r="3.5" fill="#475569" />
      <circle cx="40" cy="16" r="3.5" fill="#475569" />
      
      <!-- Mini Browser Address Bar -->
      <rect x="56" y="6" width="280" height="20" rx="10" fill="#0B0F19" />
      <text x="196" y="19.5" class="ide-mono" font-size="9.5" fill="#38BDF8" text-anchor="middle">http://127.0.0.1:8000/preview</text>
      
      <!-- Responsive Icon -->
      <rect x="350" y="6" width="56" height="20" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="378" y="19" class="ide-sans" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">LIVE ⚡</text>

      <!-- Web Content Render Area -->
      <g transform="translate(24, 52)">
        <text x="0" y="20" class="ide-sans" font-size="16" font-weight="800" fill="#F8FAFC">Build Websites in Simple English</text>
        <text x="0" y="40" class="ide-sans" font-size="11.5" fill="#94A3B8">ENT is readable for everyone.</text>

        <!-- Preview Card Section -->
        <g transform="translate(0, 58)">
          <rect width="372" height="135" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="16" y="26" class="ide-sans" font-size="13" font-weight="700" fill="#F8FAFC">Why ENT?</text>
          <text x="16" y="44" class="ide-sans" font-size="11" fill="#94A3B8">No scary curly braces or symbols.</text>

          <rect x="16" y="62" width="105" height="30" rx="6" fill="#2563EB" />
          <text x="68.5" y="81" class="ide-sans" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get Started</text>

          <text x="135" y="81" class="ide-sans" font-size="11.5" font-weight="600" fill="#38BDF8">Read Docs ↗</text>
          
          <rect x="16" y="102" width="340" height="20" rx="4" fill="#0F172A" />
          <text x="186" y="115.5" class="ide-mono" font-size="9" fill="#10B981" text-anchor="middle">✓ HTML5 + CSS3 Generated Live • XSS Safe</text>
        </g>
      </g>
    </g>


    <!-- ================= 4. BOTTOM PANEL: TERMINAL & LOGS ================= -->
    <g transform="translate(220, 428)">
      <rect width="880" height="142" fill="#080C14" stroke="#1E293B" stroke-width="1" />
      
      <!-- Terminal Tab Bar -->
      <rect width="880" height="28" fill="#0F172A" />
      <g transform="translate(16, 18)">
        <text x="0" y="0" class="ide-sans" font-size="10.5" font-weight="700" fill="#38BDF8">TERMINAL</text>
        <text x="90" y="0" class="ide-sans" font-size="10.5" font-weight="600" fill="#64748B">PROBLEMS (0)</text>
        <text x="190" y="0" class="ide-sans" font-size="10.5" font-weight="600" fill="#64748B">OUTPUT</text>
      </g>

      <!-- Terminal Output Content -->
      <g transform="translate(18, 50)" class="ide-mono" font-size="11">
        <text x="0" y="0" fill="#38BDF8">&gt; ent dev website.ent</text>
        <text x="0" y="20" fill="#10B981">[INFO] Lexer &amp; Pratt Parser: 18 AST nodes validated (0 errors)</text>
        <text x="0" y="38" fill="#F8FAFC">[BUILD] Static generator compiled: dist/index.html &amp; styles.css (12ms)</text>
        <text x="0" y="56" fill="#A5B4FC">[READY] Live development server listening on http://127.0.0.1:8000</text>
      </g>
    </g>

  </g>
</svg>