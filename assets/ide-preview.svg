<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" fill="none">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="ideShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    .ide-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ide-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Window Frame -->
  <g filter="url(#ideShadow)">
    <rect x="20" y="20" width="1060" height="520" rx="16" fill="url(#ideBg)" stroke="#334155" stroke-width="1.5" />

    <!-- ================= TOP NAVIGATION BAR ================= -->
    <path d="M 20 36 C 20 27.16 27.16 20 36 20 L 1064 20 C 1072.84 20 1080 27.16 1080 36 L 1080 68 L 20 68 Z" fill="url(#topbarGrad)" />
    
    <!-- Window Controls -->
    <circle cx="44" cy="44" r="5.5" fill="#EF4444" />
    <circle cx="62" cy="44" r="5.5" fill="#F59E0B" />
    <circle cx="80" cy="44" r="5.5" fill="#10B981" />

    <!-- App Brand -->
    <text x="110" y="49" class="ide-sans" font-size="14" font-weight="800" fill="#F8FAFC">⚡ ENT Studio</text>
    <rect x="200" y="34" width="48" height="20" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="224" y="48" class="ide-sans" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">v0.1.0</text>

    <!-- Center / Action Buttons -->
    <g transform="translate(420, 31)">
      <!-- Run Button -->
      <rect x="0" y="0" width="130" height="27" rx="6" fill="#2563EB" />
      <text x="65" y="18" class="ide-sans" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">▶ Run (Ctrl+Enter)</text>

      <!-- Check Button -->
      <rect x="140" y="0" width="85" height="27" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="182" y="18" class="ide-sans" font-size="11.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">✔ Check</text>

      <!-- Web Preview Button -->
      <rect x="235" y="0" width="115" height="27" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="292" y="18" class="ide-sans" font-size="11.5" font-weight="600" fill="#38BDF8" text-anchor="middle">🌐 Web Preview</text>
    </g>

    <!-- Right Profile / Status -->
    <g transform="translate(930, 36)">
      <rect width="130" height="22" rx="11" fill="#020617" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="11" r="4" fill="#10B981" />
      <text x="24" y="15" class="ide-mono" font-size="10" fill="#94A3B8">Engine: Online</text>
    </g>


    <!-- ================= MAIN THREE-COLUMN WORKSPACE ================= -->

    <!-- 1. LEFT COLUMN: FILE EXPLORER (Width: 200px) -->
    <g transform="translate(20, 68)">
      <rect width="200" height="472" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      
      <!-- Explorer Title -->
      <text x="20" y="30" class="ide-sans" font-size="11" font-weight="800" fill="#64748B" letter-spacing="1">EXPLORER</text>
      
      <!-- File List -->
      <g transform="translate(14, 45)" class="ide-sans" font-size="12">
        <!-- hello.ent -->
        <text x="14" y="20" fill="#94A3B8">📄 hello.ent</text>
        
        <!-- variables.ent -->
        <text x="14" y="46" fill="#94A3B8">📄 variables.ent</text>
        
        <!-- math.ent -->
        <text x="14" y="72" fill="#94A3B8">📄 math.ent</text>
        
        <!-- conditions.ent -->
        <text x="14" y="98" fill="#94A3B8">📄 conditions.ent</text>
        
        <!-- loops.ent -->
        <text x="14" y="124" fill="#94A3B8">📄 loops.ent</text>

        <!-- website.ent (Active & Highlighted) -->
        <rect x="-4" y="137" width="180" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
        <text x="14" y="156" font-weight="700" fill="#38BDF8">🌐 website.ent</text>

        <!-- functions.ent -->
        <text x="14" y="188" fill="#94A3B8">📄 functions.ent</text>
      </g>

      <!-- Rename Hint -->
      <g transform="translate(14, 420)">
        <rect width="172" height="36" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1" />
        <text x="86" y="18" class="ide-sans" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">💡 Inline Rename</text>
        <text x="86" y="29" class="ide-sans" font-size="9" fill="#64748B" text-anchor="middle">Press F2 or click Rename</text>
      </g>
    </g>


    <!-- 2. CENTER COLUMN: MONACO CODE EDITOR (Width: 460px) -->
    <g transform="translate(220, 68)">
      <rect width="460" height="350" fill="#0F172A" />

      <!-- Active File Tab -->
      <rect width="150" height="30" fill="#1E293B" />
      <text x="20" y="20" class="ide-mono" font-size="11.5" font-weight="600" fill="#38BDF8">website.ent •</text>
      <text x="135" y="19" class="ide-sans" font-size="11" fill="#64748B">×</text>

      <!-- Code & Line Numbers -->
      <!-- Line Numbers Gutter -->
      <g transform="translate(0, 30)">
        <rect width="36" height="320" fill="#090D16" />
        <g class="ide-mono" font-size="11" fill="#475569" text-anchor="end">
          <text x="28" y="24">1</text>
          <text x="28" y="46">2</text>
          <text x="28" y="68">3</text>
          <text x="28" y="90">4</text>
          <text x="28" y="112">5</text>
          <text x="28" y="134">6</text>
          <text x="28" y="156">7</text>
          <text x="28" y="178">8</text>
          <text x="28" y="200">9</text>
          <text x="28" y="222">10</text>
          <text x="28" y="244">11</text>
          <text x="28" y="266">12</text>
        </g>
      </g>

      <!-- Code Syntax Highlighting -->
      <g transform="translate(50, 48)" class="ide-mono" font-size="11.5" line-height="22">
        <text y="6" fill="#38BDF8" font-weight="700">[</text>
        <text y="28" x="14" fill="#818CF8">page<tspan fill="#F8FAFC">(</tspan><tspan fill="#94A3B8">title = </tspan><tspan fill="#34D399">"Welcome to ENT"</tspan><tspan fill="#F8FAFC">)</tspan> <tspan fill="#38BDF8">[</tspan></text>
        
        <text y="50" x="28" fill="#60A5FA">heading<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Build Websites in Simple English"</tspan><tspan fill="#94A3B8">, level = </tspan><tspan fill="#F59E0B">1</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text y="72" x="28" fill="#60A5FA">paragraph<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"ENT is readable for everyone."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text y="94" x="28" fill="#60A5FA">section<tspan fill="#F8FAFC">()</tspan> <tspan fill="#38BDF8">[</tspan></text>
        <text y="116" x="42" fill="#60A5FA">heading<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Why ENT?"</tspan><tspan fill="#94A3B8">, level = </tspan><tspan fill="#F59E0B">2</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text y="138" x="42" fill="#60A5FA">paragraph<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"No scary curly braces or symbols."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text y="160" x="42" fill="#F472B6">button<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Get Started"</tspan><tspan fill="#94A3B8">, onclick = </tspan><tspan fill="#34D399">"alert('Hi!')"</tspan><tspan fill="#F8FAFC">)</tspan></text>
        <text y="182" x="42" fill="#F472B6">link<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Read Docs"</tspan><tspan fill="#94A3B8">, url = </tspan><tspan fill="#34D399">"..."</tspan><tspan fill="#F8FAFC">)</tspan></text>
        
        <text y="204" x="28" fill="#38BDF8">]</tspan></text>
        <text y="226" x="14" fill="#38BDF8">]</tspan></text>
        <text y="248" x="0" fill="#38BDF8" font-weight="700">]</text>
      </g>
    </g>


    <!-- 3. RIGHT COLUMN: LIVE BROWSER PREVIEW (Width: 400px) -->
    <g transform="translate(680, 68)">
      <rect width="400" height="350" fill="#111827" stroke="#1E293B" stroke-width="1" />
      
      <!-- Preview Header Tab -->
      <path d="M 0 0 L 400 0 L 400 30 L 0 30 Z" fill="#1E293B" />
      <text x="16" y="20" class="ide-sans" font-size="11" font-weight="700" fill="#38BDF8">🌐 Web Preview (Live)</text>
      
      <!-- Mini Browser URL Bar -->
      <rect x="140" y="6" width="220" height="18" rx="9" fill="#0B0F19" />
      <text x="250" y="19" class="ide-mono" font-size="9" fill="#94A3B8" text-anchor="middle">http://127.0.0.1:8000/preview</text>

      <!-- Live Web Page Preview -->
      <g transform="translate(24, 50)">
        <text x="0" y="22" class="ide-sans" font-size="16" font-weight="900" fill="#F8FAFC">Build Websites in Simple English</text>
        <text x="0" y="42" class="ide-sans" font-size="11" fill="#94A3B8">ENT is readable for everyone.</text>

        <!-- Preview Section Card -->
        <g transform="translate(0, 60)">
          <rect width="350" height="130" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="14" y="26" class="ide-sans" font-size="13" font-weight="700" fill="#F8FAFC">Why ENT?</text>
          <text x="14" y="44" class="ide-sans" font-size="10.5" fill="#94A3B8">No scary curly braces or symbols.</text>

          <rect x="14" y="62" width="90" height="28" rx="6" fill="#2563EB" />
          <text x="59" y="80" class="ide-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get Started</text>

          <text x="118" y="81" class="ide-sans" font-size="11" font-weight="600" fill="#38BDF8">Read Docs ↗</text>
          
          <rect x="14" y="100" width="322" height="18" rx="4" fill="#0F172A" />
          <text x="175" y="113" class="ide-mono" font-size="9" fill="#10B981" text-anchor="middle">✓ HTML5 + CSS3 Generated Live</text>
        </g>
      </g>
    </g>


    <!-- ================= BOTTOM PANEL: TERMINAL / LOGS ================= -->
    <g transform="translate(220, 418)">
      <rect width="860" height="122" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      
      <!-- Terminal Tab Header -->
      <path d="M 0 0 L 860 0 L 860 26 L 0 26 Z" fill="#111827" />
      <text x="16" y="17" class="ide-sans" font-size="10.5" font-weight="700" fill="#E2E8F0">TERMINAL OUTPUT</text>
      <text x="140" y="17" class="ide-sans" font-size="10.5" font-weight="600" fill="#64748B">PROBLEMS (0)</text>

      <!-- Terminal Output Log -->
      <g transform="translate(16, 44)" class="ide-mono" font-size="11">
        <text y="0" fill="#38BDF8">&gt; ent run website.ent</text>
        <text y="20" fill="#10B981">[Page: Welcome to ENT] • [Heading 1]: Build Websites in Simple English</text>
        <text y="38" fill="#F8FAFC">&gt; Success: Built website at 'dist/index.html' (42 execution steps, 0 errors)</text>
      </g>
    </g>

  </g>
</svg>
