<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" fill="none">
  <defs>
    <linearGradient id="badBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="goodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Left: Traditional Languages (Red/Warning theme) -->
  <g transform="translate(20, 20)">
    <rect width="460" height="220" rx="14" fill="url(#badBg)" stroke="#EF4444" stroke-width="1.5" />
    
    <!-- Header -->
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 446 0 C 453.73 0 460 6.27 460 14 L 460 36 L 0 36 Z" fill="#292524" />
    <circle cx="20" cy="18" r="5" fill="#EF4444" />
    <text x="36" y="22" class="sans" font-size="12" font-weight="700" fill="#EF4444">❌ Traditional Languages (Complex &amp; Cluttered)</text>

    <!-- Code Sample -->
    <g transform="translate(20, 56)" class="mono" font-size="11.5" line-height="20">
      <text y="0" fill="#78716C">// Imports, complex curly braces &amp; boilerplate</text>
      <text y="20" fill="#EF4444">import <tspan fill="#A8A29E">{ useState, useEffect }</tspan> from <tspan fill="#FCA5A5">'react'</tspan>;</text>
      <text y="42" fill="#F87171">function <tspan fill="#A8A29E">App()</tspan> {</text>
      <text y="64" x="16" fill="#FCA5A5">const [count, setCount] = useState(0);</text>
      <text y="86" x="16" fill="#FCA5A5">return &lt;<tspan fill="#F87171">button</tspan> onClick={() =&gt; setCount(c =&gt; c+1)}&gt;</text>
      <text y="108" x="32" fill="#E7E5E4">Click me {count}&lt;/<tspan fill="#F87171">button</tspan>&gt;;</text>
      <text y="130" fill="#F87171">}</text>
    </g>
  </g>

  <!-- Right: ENT Programming (Green/Cyan Success theme) -->
  <g transform="translate(520, 20)">
    <rect width="460" height="220" rx="14" fill="url(#goodBg)" stroke="#10B981" stroke-width="1.8" />
    
    <!-- Header -->
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 446 0 C 453.73 0 460 6.27 460 14 L 460 36 L 0 36 Z" fill="#1E293B" />
    <circle cx="20" cy="18" r="5" fill="#10B981" />
    <text x="36" y="22" class="sans" font-size="12" font-weight="700" fill="#34D399">✨ ENT Programming (Clean &amp; English-Readable)</text>

    <!-- Code Sample -->
    <g transform="translate(20, 56)" class="mono" font-size="12" line-height="20">
      <text y="0" fill="#64748B"># No curly braces. Natural English syntax.</text>
      <text y="20" fill="#38BDF8" font-weight="700">[</text>
      <text y="42" x="16" fill="#818CF8">page<tspan fill="#F8FAFC">(</tspan><tspan fill="#94A3B8">title = </tspan><tspan fill="#34D399">"My App"</tspan><tspan fill="#F8FAFC">)</tspan> <tspan fill="#38BDF8">[</tspan></text>
      <text y="64" x="32" fill="#60A5FA">heading<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Welcome to ENT"</tspan><tspan fill="#F8FAFC">)</tspan></text>
      <text y="86" x="32" fill="#F472B6">button<tspan fill="#F8FAFC">(</tspan><tspan fill="#34D399">"Click me"</tspan><tspan fill="#94A3B8">, onclick = </tspan><tspan fill="#34D399">"alert('Hi!')"</tspan><tspan fill="#F8FAFC">)</tspan></text>
      <text y="108" x="16" fill="#38BDF8">]</tspan></text>
      <text y="130" fill="#38BDF8" font-weight="700">]</text>
    </g>
  </g>
</svg>
