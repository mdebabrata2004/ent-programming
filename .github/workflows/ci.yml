name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Python Test Suite (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: Verify CLI Executable
        run: |
          python -m ent.cli --version
          python -m ent.cli examples/hello.ent
          python -m ent.cli check examples/website.ent
          python -m ent.cli build examples/website.ent -o dist_test

  build-ide:
    name: Build ENT Studio Web IDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ide/package.json

      - name: Install IDE dependencies
        run: |
          cd ide
          npm ci || npm install

      - name: Build IDE Bundle
        run: |
          cd ide
          npm run build
